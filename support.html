<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support | KyleFX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">Kyle<span>FX</span></a>
    <nav class="nav-links">
      <a href="features.html">Features</a>
      <a href="workspace.html">Workspace</a>
      <a href="accounts.html">Accounts</a>
      <a href="support.html" class="active">Support</a>
    </nav>
    <a href="#" class="btn btn-primary">Launch Platform</a>
  </header>

  <section class="section" style="padding-top: 140px;">
    <div class="section-inner">
      <div class="section-label">Help Center</div>
      <h2 class="section-title">We're Here 24/7</h2>
      <p class="section-subtitle">Get answers or reach out to our support team.</p>

      <div class="features-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="feature-card">
          <h3>📧 Email Support</h3>
          <p>support@kylefx.com<br>Response within 2 hours</p>
        </div>
        <div class="feature-card">
          <h3>💬 Live Chat</h3>
          <p>Available 24/7 inside the platform.<br>Average wait: under 1 minute.</p>
        </div>
      </div>

      <div style="margin-top: 48px; max-width: 600px;">
        <h3 style="margin-bottom: 16px;">Send a Message</h3>
        <form style="display: flex; flex-direction: column; gap: 16px;">
          <input type="text" placeholder="Your Name" style="padding: 14px; border-radius: 8px; border: 1px solid var(--border-subtle); background: var(--bg-elevated); color: var(--text-primary);">
          <input type="email" placeholder="Email Address" style="padding: 14px; border-radius: 8px; border: 1px solid var(--border-subtle); background: var(--bg-elevated); color: var(--text-primary);">
          <textarea rows="5" placeholder="How can we help?" style="padding: 14px; border-radius: 8px; border: 1px solid var(--border-subtle); background: var(--bg-elevated); color: var(--text-primary);"></textarea>
          <button type="submit" class="btn btn-primary btn-lg" style="align-self: flex-start;">Send Message</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer (same as index.html) -->
</body>
</html>
